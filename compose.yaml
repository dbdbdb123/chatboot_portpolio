name: mori

services:
  # 세션별 채팅 메시지를 보관한다. 애플리케이션이 메시지 생성 시각을 기준으로
  # 3일이 지난 항목만 정리하며, AOF와 named volume으로 컨테이너 재생성 후에도 유지한다.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    ports:
      # 로컬 디버깅에는 열어 두되 외부 네트워크에서는 접근할 수 없게 loopback에 바인딩한다.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.17.0
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
  # 실제 Qwen 모델을 로딩하고 추론 API를 제공한다.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11435:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # 볼륨에 모델이 없을 때만 레이어를 내려받고, 준비가 끝나면 종료한다.
  model-init:
    image: ollama/ollama:latest
    restart: "no"
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["export OLLAMA_HOST=http://ollama:11434; ollama pull qwen3.5:2b-q4_K_M && ollama pull embeddinggemma"]
    depends_on:
      ollama:
        condition: service_healthy

  # UI, REST API, MCP Host/Client 역할을 담당한다.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3.5:2b-q4_K_M
      QDRANT_URL: http://qdrant:6333
      RAG_EMBEDDING_MODEL: embeddinggemma
      # Compose 내부에서는 서비스 DNS 이름을 사용한다. 호스트용 127.0.0.1 주소와 구분한다.
      REDIS_URL: redis://redis:6379/0
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://us.cloud.langfuse.com}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-development}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      # 앱 시작 시 Redis 연결 확인에 실패해 기록 기능이 비활성화되지 않도록 준비 완료를 기다린다.
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully

volumes:
  # compose down 후에도 다운로드한 모델을 유지한다.
  ollama-data:
  qdrant-data:
  # compose down에서는 유지되고 `docker compose down -v`를 실행할 때만 함께 삭제된다.
  redis-data:
