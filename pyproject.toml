[project]
name = "mainportpolio3"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langchain>=1.2,<2",
    "langchain-core==1.6.3",
    "langchain-ollama>=1.1,<1.2",
    "langchain-mcp-adapters>=0.3,<0.4",
    "langfuse>=4,<5",
    "mcp>=1.24,<2",
    "Pillow>=12,<13",
    "pypdf>=6,<7",
    "redis>=6,<7",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
