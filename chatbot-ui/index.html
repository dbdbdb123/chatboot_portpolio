<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="가볍고 빠른 로컬 AI 어시스턴트 Mori">
  <title>Mori — 로컬 AI 어시스턴트</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="대화 탐색">
      <div class="brand-mark" aria-label="Mori">
        <svg viewBox="0 0 44 44" role="img" aria-hidden="true">
          <path d="M22 2c1.5 12.5 5.5 16.5 18 18-12.5 1.5-16.5 5.5-18 18-1.5-12.5-5.5-16.5-18-18C16.5 18.5 20.5 14.5 22 2Z"/>
          <circle cx="8" cy="7" r="3"/><circle cx="36" cy="36" r="2.5"/>
        </svg>
      </div>

      <div class="sidebar-footer">
        <button type="button" class="sidebar-link" id="settingsButton"><span aria-hidden="true">⚙</span> 설정</button>
        <button type="button" class="sidebar-link" id="helpButton"><span aria-hidden="true">?</span> 도움말</button>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <button class="menu-button" id="menuButton" type="button" aria-label="메뉴 열기" aria-expanded="false">☰</button>
        <h1>Mori</h1>
        <span class="model-badge" id="modelBadge">모델 확인 중</span>
        <button class="connection" type="button" aria-label="연결 상태: 로컬 연결됨">
          <span class="status-dot"></span> 로컬 연결됨 <span class="chevron">⌄</span>
        </button>
      </header>

      <section class="chat-area" aria-label="채팅">
        <div class="chat-scroll" id="chatScroll" aria-live="polite">
          <div class="welcome" id="welcome">
            <div class="welcome-mark" aria-hidden="true">✦</div>
            <h2>Mori에 오신 것을 환영합니다!</h2>
            <p>가볍고 빠른 로컬 AI 어시스턴트입니다.<br>무엇을 도와드릴까요?</p>
          </div>

          <div class="conversation" id="conversation">
          </div>
        </div>

        <div class="composer-wrap">
          <form class="composer" id="chatForm">
            <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden>
            <div id="imageAttachment" class="image-attachment" hidden>
              <img id="imagePreview" alt="첨부 이미지 미리보기">
              <span id="imageName"></span>
              <button id="removeImage" type="button" aria-label="첨부 이미지 제거">×</button>
            </div>
            <label for="messageInput" class="sr-only">메시지 입력</label>
            <textarea id="messageInput" rows="1" placeholder="무엇이든 물어보세요" maxlength="2000"></textarea>
            <div class="composer-actions">
              <button class="tool-toggle" id="attachImage" type="button" aria-label="이미지 첨부" title="PNG·JPEG·WebP 1장, 최대 10MB">이미지 첨부</button>
              <button class="tool-toggle" id="toolToggle" type="button" aria-pressed="true"><span>⌘</span> OCR 도구 <span class="chevron"></span></button>
              <button class="tool-toggle" id="thinkingToggle" type="button" aria-label="Thinking 모드" aria-pressed="false" title="켜면 답변 전 추론을 수행하며 대기 시간이 길어질 수 있습니다.">Thinking <span id="thinkingState">OFF</span></button>
              <button class="send-button" id="sendButton" type="submit" aria-label="메시지 보내기">➤</button>
            </div>
          </form>
          <p class="disclaimer">AI가 실수할 수 있습니다.</p>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="constants.js"></script>
  <script src="app.js"></script>
</body>
</html>
